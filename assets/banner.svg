<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e100ff" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.9" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="text-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatReverse {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      .floating-card-left { animation: floatSlow 6s ease-in-out infinite; }
      .floating-card-right { animation: floatReverse 7s ease-in-out infinite; }
      .bg-pulse { animation: pulseGlow 8s ease-in-out infinite; transform-origin: center; }
      .flow-line { stroke-dasharray: 8, 8; animation: dashFlow 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-gradient)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05">
    <path d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200 M0 320H1200 M0 360H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M100 0V400 M200 0V400 M300 0V400 M400 0V400 M500 0V400 M600 0V400 M700 0V400 M800 0V400 M900 0V400 M1000 0V400 M1100 0V400" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Ambient Glow Orbs in Background -->
  <circle cx="200" cy="100" r="180" fill="url(#glow-purple)" class="bg-pulse" />
  <circle cx="1000" cy="300" r="200" fill="url(#glow-cyan)" class="bg-pulse" />

  <!-- Animated Flow Lines in Background -->
  <path d="M 150,200 Q 300,80 600,200 T 1050,200" fill="none" stroke="url(#glow-cyan)" stroke-width="2" opacity="0.4" class="flow-line" />
  <path d="M 100,280 Q 400,350 700,220 T 1100,120" fill="none" stroke="url(#glow-purple)" stroke-width="2" opacity="0.3" class="flow-line" />

  <!-- Left Floating Tech Card (Background Element, low opacity/offset) -->
  <g class="floating-card-left" opacity="0.85" filter="url(#shadow)">
    <rect x="60" y="70" width="220" height="70" rx="12" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5" />
    <circle cx="95" cy="105" r="16" fill="#00f2fe" opacity="0.2" />
    <text x="95" y="110" fill="#00f2fe" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">🎫</text>
    <text x="125" y="98" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Ticket Deflection</text>
    <text x="125" y="118" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">85% Automated</text>
  </g>

  <g class="floating-card-left" opacity="0.85" filter="url(#shadow)">
    <rect x="80" y="260" width="230" height="70" rx="12" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5" />
    <circle cx="115" cy="295" r="16" fill="#7f00ff" opacity="0.2" />
    <text x="115" y="300" fill="#e100ff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="145" y="288" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Agentic Workflows</text>
    <text x="145" y="308" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">MCP &amp; Multi-Agent</text>
  </g>

  <!-- Right Floating Tech Card (Background Element, low opacity/offset) -->
  <g class="floating-card-right" opacity="0.85" filter="url(#shadow)">
    <rect x="920" y="70" width="220" height="70" rx="12" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5" />
    <circle cx="955" cy="105" r="16" fill="#4facfe" opacity="0.2" />
    <text x="955" y="110" fill="#4facfe" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">🤖</text>
    <text x="985" y="98" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="600">ITSM AI Copilots</text>
    <text x="985" y="118" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Enterprise &amp; Open-Source</text>
  </g>

  <g class="floating-card-right" opacity="0.85" filter="url(#shadow)">
    <rect x="900" y="260" width="230" height="70" rx="12" fill="url(#card-grad)" stroke="#30363d" stroke-width="1.5" />
    <circle cx="935" cy="295" r="16" fill="#00f2fe" opacity="0.2" />
    <text x="935" y="300" fill="#00f2fe" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">🔒</text>
    <text x="965" y="288" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="13" font-weight="600">On-Prem &amp; RAG</text>
    <text x="965" y="308" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Data Privacy First</text>
  </g>

  <!-- FOREGROUND LAYER: Title and Subtitle (Always Sharp & Unobscured) -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Top Category Badge -->
    <rect x="470" y="55" width="260" height="32" rx="16" fill="#1f6feb" fill-opacity="0.25" stroke="#388bfd" stroke-width="1" />
    <text x="600" y="76" fill="#58a6ff" font-family="system-ui, -apple-system, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">OCTOBER 2026 EDITION 🚀</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="#ffffff" font-family="system-ui, -apple-system, Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" filter="url(#text-glow)">
      Awesome AI IT Service Desk Agent
    </text>
    <text x="600" y="145" fill="url(#glow-cyan)" font-family="system-ui, -apple-system, Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" opacity="0.4">
      Awesome AI IT Service Desk Agent
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" fill="#c9d1d9" font-family="system-ui, -apple-system, Roboto, sans-serif" font-size="18" font-weight="500">
      Curated Ecosystem of Autonomous Service Desk Agents &amp; Open-Source ITSM Frameworks
    </text>

    <!-- Feature Pills in Center Foreground -->
    <g transform="translate(320, 235)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="85" y="21" fill="#79c0ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🤖 Virtual Support Agents</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="190" height="34" rx="17" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="280" y="21" fill="#7ee787" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎯 Self-Service Deflection</text>

      <!-- Pill 3 -->
      <rect x="390" y="0" width="170" height="34" rx="17" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="475" y="21" fill="#d2a8ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔓 Open-Source RAG</text>
    </g>
  </g>
</svg>
